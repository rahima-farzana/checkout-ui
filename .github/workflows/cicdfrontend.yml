name: "Frontend GitOps Assest Sync"

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      s3bucket:
        description: "s3 bucket"
        required: true
        default: "wezvatech-eks-backup-2026-may"
jobs:
  deploy:
    name: "Build & Deploy Frontend"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: NPM Audit Scan
        run: npm audit --audit-level=high

      - name: Run Trivy FS Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'HIGH,CRITICAL'
          exit-code: '0'

      - name: Build Application
        run: npm run build

      - name: Verify Build Artifact
        run: |
          ls -la dist/

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: dist/

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Reconcile S3 Asset State
        run: |
          # Dynamically determine the bucket from the repository's configuration
          aws s3 sync dist/ s3://${{ inputs.s3bucket }}/ --delete

#      - name: Invalidate CDN Edge Cache
